<!DOCTYPE html>
<html>
<head>
  <base href="/Menu-pages/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="家族メニュー管理アプリ">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Menu">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Menu</title>
  <link rel="manifest" href="manifest.json">
  <!-- CI が BUILD_ID / APP_VERSION を置換。LIFFキャッシュ破棄に使用 -->
  <meta name="build-id" content="012943a">
  <meta name="app-version" content="2.4.2(61)">

  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>

  <style>
    /* LIFFの「スワイプで閉じる」ジェスチャーをFlutterスクロールより優先させない */
    html, body {
      margin: 0;
      height: 100%;
      overscroll-behavior: none;
      touch-action: pan-y;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      font-family: sans-serif;
      color: #888;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="loading">読み込み中...</div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading').style.display = 'none';
    });
  </script>

  <script>
    // SW が新バージョンに切り替わった瞬間に自動リロード。
    // Flutter の SW は install 時に skipWaiting() を呼ぶため、
    // 新デプロイ後は controllerchange → reload で確実に最新版が表示される。
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        window.location.reload();
      });
      // 既存の古いキャッシュに詰まっている場合の一回限り強制リセット。
      // build-id が変わるたびに実行される。
      var buildMeta = document.querySelector('meta[name="build-id"]');
      var verMeta = document.querySelector('meta[name="app-version"]');
      var buildId = buildMeta ? buildMeta.content : '';
      var appVer = verMeta ? verMeta.content : '';
      var cacheKey = buildId + '_' + appVer;
      console.log('[Menu] cache check buildId=' + buildId + ' appVer=' + appVer + ' cacheKey=' + cacheKey + ' stored=' + localStorage.getItem('sw_cache_key'));
      if (cacheKey && buildId !== 'BUILD_ID' && appVer !== 'APP_VERSION' &&
          localStorage.getItem('sw_cache_key') !== cacheKey) {
        console.log('[Menu] clearing SW/cache, reloading…');
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }).then(function () {
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          });
        }).then(function () {
          localStorage.setItem('sw_cache_key', cacheKey);
          localStorage.removeItem('sw_build_id');
          window.location.reload();
        });
      }
    })();
  </script>

  <script>
    // LIFF Full サイズでもスワイプ閉じが発火する問題への対処。
    // Flutter Web (CanvasKit) は pointer events で独自スクロールするため
    // touchmove の preventDefault() を呼んでも Flutter スクロールは壊れない。
    (function () {
      document.addEventListener('touchmove', function (e) {
        e.preventDefault();
        e.stopPropagation();
      }, { passive: false, capture: true });
    })();
  </script>

  <script src="flutter_bootstrap.js?v=2.4.2(61)" async></script>
</body>
</html>
