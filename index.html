<!DOCTYPE html>
<html>
<head>
  <base href="/Menu-pages/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="家族メニュー管理アプリ">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Menu">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Menu</title>
  <link rel="manifest" href="manifest.json">
  <!-- CI が d600095 をコミットハッシュに置換する。新デプロイ検出に使用 -->
  <meta name="build-id" content="d600095">

  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>

  <style>
    /* LIFFの「スワイプで閉じる」ジェスチャーをFlutterスクロールより優先させない */
    html, body {
      margin: 0;
      height: 100%;
      overscroll-behavior: none;
      touch-action: pan-y;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      font-family: sans-serif;
      color: #888;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="loading">読み込み中...</div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading').style.display = 'none';
    });
  </script>

  <script>
    // 新デプロイ検出: build-id が localStorage の値と異なればSWをリセットしてリロード。
    // sessionStorage と違い localStorage はタブをまたいで保持されるため
    // デプロイのたびに必ず1回だけクリアが走る。
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var meta = document.querySelector('meta[name="build-id"]');
      var buildId = meta ? meta.content : '';
      if (!buildId || buildId === 'd600095') return; // ローカル開発時はスキップ
      if (localStorage.getItem('sw_build_id') === buildId) return;
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        var jobs = regs.map(function (r) { return r.unregister(); });
        return Promise.all(jobs).then(function () {
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          });
        });
      }).then(function () {
        localStorage.setItem('sw_build_id', buildId);
        window.location.reload();
      });
    })();
  </script>

  <script>
    // LIFF Full サイズでもスワイプ閉じが発火する問題への対処。
    // Flutter Web (CanvasKit) は pointer events で独自スクロールするため
    // touchmove の preventDefault() を呼んでも Flutter スクロールは壊れない。
    (function () {
      document.addEventListener('touchmove', function (e) {
        e.preventDefault();
        e.stopPropagation();
      }, { passive: false, capture: true });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
